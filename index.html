<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videokê - Busca de Músicas</title>
<style>
:root{--red:#d62828;--ink:#222;--muted:#666;--bg:#f4f4f4;--card:#fff;--border:#d8d8d8}
*{box-sizing:border-box} body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px;background:var(--bg);color:var(--ink)}
h1{text-align:center;margin:24px 0}.sub{text-align:center;color:var(--muted);margin:-12px 0 24px}
#busca{width:100%;padding:16px;font-size:18px;border-radius:10px;border:1px solid var(--border);margin-bottom:14px;outline:none}
#busca:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,40,40,.12)}
.total{margin:0 0 15px;color:var(--muted)}.card{background:var(--card);border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.09)}
.codigo{color:var(--red);font-weight:bold;font-size:22px}.cantor{font-size:18px;font-weight:bold;margin-top:5px}.musica{color:#555;margin-top:3px}.aviso{background:#fff7e6;border:1px solid #f1d18a;border-radius:9px;padding:12px;color:#6b4b00}
@media(max-width:520px){body{padding:14px}h1{font-size:27px}.card{padding:13px}}
</style>
</head>
<body>
<h1>🎤 Catálogo do Videokê</h1>
<p class="sub">Pesquise por cantor, música ou código</p>
<input type="search" id="busca" placeholder="Ex.: Roberto Carlos, Evidências ou 4714" autocomplete="off" autofocus>
<div class="total" id="total"></div><div id="lista"></div>
<script src="musicas.js"></script>
<script>
const busca=document.getElementById('busca'), lista=document.getElementById('lista'), total=document.getElementById('total');
const normalizar=s=>(s??'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const escapar=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function buscar(){
 const termo=normalizar(busca.value);
 if(!termo){total.textContent=`${musicas.length.toLocaleString('pt-BR')} músicas no catálogo`;lista.innerHTML='<div class="aviso">Digite um cantor, uma música ou um código para começar.</div>';return;}
 const resultado=musicas.filter(x=>normalizar(x.codigo).includes(termo)||normalizar(x.cantor).includes(termo)||normalizar(x.musica).includes(termo));
 const limite=200, exibidos=resultado.slice(0,limite);
 total.textContent=resultado.length?`${resultado.length.toLocaleString('pt-BR')} resultado(s) encontrado(s)${resultado.length>limite?' — mostrando os primeiros 200':''}`:'Nenhum resultado encontrado';
 lista.innerHTML=exibidos.map(x=>`<article class="card"><div class="codigo">${escapar(x.codigo)}</div><div class="cantor">${escapar(x.cantor)}</div><div class="musica">${escapar(x.musica)}</div></article>`).join('');
}
busca.addEventListener('input',buscar); buscar();
</script>
</body></html>
